name: Format Diagnostic

on:
  push:
    branches:
      - feat/commission-dashboard

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/src/components/commissions/commission-dashboard.tsx
          git diff -- apps/web/src/components/commissions/commission-dashboard.tsx
