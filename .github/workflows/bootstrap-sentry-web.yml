name: Bootstrap Sentry Web Dependency

on:
  push:
    branches:
      - feat/frontend-error-monitoring-v2

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-error-monitoring-v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Add Sentry Next.js SDK
        run: pnpm --filter @recruitops/web add @sentry/nextjs@^11.1.0

      - name: Commit dependency update
        run: |
          if git diff --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m 'chore(web): add Sentry SDK'
          git push origin HEAD:feat/frontend-error-monitoring-v2
