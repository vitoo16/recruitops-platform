name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret-management guardrail
        run: node tooling/scripts/check-secrets.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Diagnose Meta formatter
        run: |
          pnpm exec prettier --write apps/api/src/meta-connections/meta-connections.service.ts
          git diff -- apps/api/src/meta-connections/meta-connections.service.ts
          test -z "$(git status --short apps/api/src/meta-connections/meta-connections.service.ts)"

      - name: Format check
        run: pnpm format:check

      - name: Validate local infrastructure configuration
        run: |
          node tooling/scripts/init-local-infra.mjs --infra-only
          docker compose --env-file infra/docker/.env.local -f infra/docker/docker-compose.yml config --quiet

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://recruitops:recruitops@localhost:5432/recruitops?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://recruitops:recruitops@localhost:5432/recruitops?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://recruitops:recruitops@localhost:5432/recruitops?schema=public
          REDIS_URL: redis://localhost:6379
