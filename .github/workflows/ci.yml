name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/publication-publish-now

      - name: Secret-management guardrail
        run: node tooling/scripts/check-secrets.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Canonicalize dependency and formatting state
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write \
            apps/api/src/publications/publications.controller.ts \
            apps/api/src/publications/publications.repository.ts \
            apps/api/src/publications/publications.service.test.ts \
            apps/api/src/publications/publications.service.ts \
            apps/web/src/components/content/publish-now-panel.tsx \
            apps/web/src/lib/publications/api.ts
          if git diff --quiet; then
            echo "Canonical state already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml \
              apps/api/src/publications/publications.controller.ts \
              apps/api/src/publications/publications.repository.ts \
              apps/api/src/publications/publications.service.test.ts \
              apps/api/src/publications/publications.service.ts \
              apps/web/src/components/content/publish-now-panel.tsx \
              apps/web/src/lib/publications/api.ts
            git commit -m "style: canonicalize publish-now slice"
            git push origin HEAD:feat/publication-publish-now
          fi

      - name: Stop after canonicalization
        run: exit 1
