name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret-management guardrail
        run: node tooling/scripts/check-secrets.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Preview publication worker formatting
        run: |
          pnpm exec prettier --write apps/worker/src/publication-executor.test.ts apps/worker/src/publication-executor.ts apps/worker/src/publication-runtime.ts
          git diff -- apps/worker/src/publication-executor.test.ts apps/worker/src/publication-executor.ts apps/worker/src/publication-runtime.ts
          test -z "$(git status --short apps/worker/src/publication-executor.test.ts apps/worker/src/publication-executor.ts apps/worker/src/publication-runtime.ts)"
