name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/threads-oauth-account-promotion

      - name: Secret-management guardrail
        run: node tooling/scripts/check-secrets.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/threads-connections/threads-connections.service.test.ts \
            apps/web/src/components/threads-connections/threads-connection-panel.tsx \
            packages/integrations/src/threads-connection.test.ts
          if git diff --quiet; then
            echo "Formatting already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/api/src/threads-connections/threads-connections.service.test.ts \
              apps/web/src/components/threads-connections/threads-connection-panel.tsx \
              packages/integrations/src/threads-connection.test.ts
            git commit -m "style: format Threads OAuth connection slice"
            git push origin HEAD:feat/threads-oauth-account-promotion
          fi

      - name: Stop after formatter sync
        run: exit 1
