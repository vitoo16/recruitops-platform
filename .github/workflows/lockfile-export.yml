name: Lockfile Export

on:
  pull_request:
    paths:
      - package.json
      - pnpm-workspace.yaml
      - apps/**/package.json
      - packages/**/package.json
      - .github/workflows/lockfile-export.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/publication-operator-e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile for playwright"
            git push origin HEAD:test/publication-operator-e2e
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
