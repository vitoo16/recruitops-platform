name: Persist Job API Lockfile

on:
  push:
    branches:
      - feat/job-api

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-api
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize job API lockfile"
          git push origin HEAD:feat/job-api
