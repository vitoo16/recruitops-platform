name: Add Sentry Node Dependency

on:
  push:
    branches:
      - feat/api-worker-error-monitoring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/api-worker-error-monitoring

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Sentry Node SDK
        run: |
          pnpm --filter @recruitops/api add @sentry/node
          pnpm --filter @recruitops/worker add @sentry/node

      - name: Commit dependency update
        run: |
          if git diff --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/package.json apps/worker/package.json pnpm-lock.yaml
          git commit -m 'chore(observability): add Sentry Node SDK'
          git push origin HEAD:feat/api-worker-error-monitoring
