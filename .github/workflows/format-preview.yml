name: Format Preview

on:
  pull_request:
    paths:
      - 'apps/api/src/content/content.repository.ts'
      - 'apps/web/src/components/content/content-media-workspace.tsx'
      - '.github/workflows/format-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: pnpm exec prettier --write apps/api/src/content/content.repository.ts apps/web/src/components/content/content-media-workspace.tsx
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/content/content.repository.ts apps/web/src/components/content/content-media-workspace.tsx; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/content/content.repository.ts apps/web/src/components/content/content-media-workspace.tsx
          git commit -m 'style: apply canonical content formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
