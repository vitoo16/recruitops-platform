name: Format Preview

on:
  pull_request:
    paths:
      - 'apps/api/src/audit/audit.types.ts'
      - '.github/workflows/format-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - name: Print canonical Prettier output
        run: pnpm exec prettier apps/api/src/audit/audit.types.ts
