name: Format Preview

on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - .github/workflows/format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - name: Format and print exact diff
        run: |
          pnpm format
          git diff -- apps/api/src/auth apps/web/src/components packages/config/src/index.ts
