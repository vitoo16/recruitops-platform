name: Format Preview Private Files

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/storage/private-files.ts'
      - 'packages/contracts/src/files.ts'
      - '.github/workflows/format-preview-private-files.yml'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write apps/web/src/lib/storage/private-files.ts packages/contracts/src/files.ts
          git diff -- apps/web/src/lib/storage/private-files.ts packages/contracts/src/files.ts
