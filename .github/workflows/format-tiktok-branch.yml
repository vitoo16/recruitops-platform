name: Format TikTok Branch

on:
  push:
    branches:
      - feat/tiktok-oauth-connection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/tiktok-oauth-connection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format TikTok files
        run: >-
          pnpm exec prettier --write
          apps/api/src/tiktok-connections/tiktok-connections.repository.ts
          apps/api/src/tiktok-connections/tiktok-connections.service.test.ts
          apps/api/src/tiktok-connections/tiktok-connections.service.ts
          apps/api/src/tiktok-connections/tiktok-oauth-state.store.test.ts
          apps/web/src/components/tiktok-connections/tiktok-connection-panel.tsx
          packages/integrations/src/tiktok-connection.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/tiktok-connections/tiktok-connections.repository.ts \
            apps/api/src/tiktok-connections/tiktok-connections.service.test.ts \
            apps/api/src/tiktok-connections/tiktok-connections.service.ts \
            apps/api/src/tiktok-connections/tiktok-oauth-state.store.test.ts \
            apps/web/src/components/tiktok-connections/tiktok-connection-panel.tsx \
            packages/integrations/src/tiktok-connection.test.ts
          git commit -m 'chore: format TikTok connection files'
          git push origin HEAD:feat/tiktok-oauth-connection
