name: Format Web Performance

on:
  push:
    branches:
      - test/web-performance-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/web-performance-review

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format performance files
        run: pnpm exec prettier --write apps/web/playwright.performance.config.ts apps/web/performance/public-shell.performance.spec.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/playwright.performance.config.ts apps/web/performance/public-shell.performance.spec.ts
          git commit -m 'style(web): format performance gate'
          git push origin HEAD:test/web-performance-review
