name: Queue Format

on:
  pull_request:
    paths:
      - 'packages/contracts/src/publication.test.ts'
      - 'packages/queue/src/index.ts'
      - '.github/workflows/format-queue.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/publication.test.ts packages/queue/src/index.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- packages/contracts/src/publication.test.ts packages/queue/src/index.ts; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/src/publication.test.ts packages/queue/src/index.ts
          git commit -m 'style: apply canonical queue formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
