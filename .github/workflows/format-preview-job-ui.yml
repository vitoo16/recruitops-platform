name: Format Preview Job UI

on:
  push:
    branches:
      - feat/job-management-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-management-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/jobs/job-hub.tsx apps/web/src/lib/jobs/api.test.ts
      - name: Commit formatted files when changed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/components/jobs/job-hub.tsx apps/web/src/lib/jobs/api.test.ts; then
            echo "Job Hub files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/jobs/job-hub.tsx apps/web/src/lib/jobs/api.test.ts
          git commit -m "style: format Job Hub UI"
          git push origin HEAD:feat/job-management-ui
