name: Format Preview Job UI

on:
  push:
    branches:
      - feat/job-management-ui

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/jobs/job-hub.tsx apps/web/src/lib/jobs/api.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-job-ui
          path: |
            apps/web/src/components/jobs/job-hub.tsx
            apps/web/src/lib/jobs/api.test.ts
