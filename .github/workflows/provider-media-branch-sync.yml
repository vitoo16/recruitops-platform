name: Provider Media Branch Sync

on:
  push:
    branches:
      - feat/provider-media-url-resolver

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/provider-media-url-resolver

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Sync lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps packages .github/workflows
          git commit -m "chore: sync provider media lockfile and formatting"
          git push origin HEAD:feat/provider-media-url-resolver
