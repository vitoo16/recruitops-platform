name: Persist Worker Runtime Lockfile

on:
  push:
    branches:
      - feat/publication-worker-runtime
    paths:
      - apps/worker/package.json
      - packages/integrations/package.json
      - .github/workflows/lockfile-persist-temp.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/publication-worker-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: persist worker runtime lockfile"
          git push origin HEAD:feat/publication-worker-runtime
