name: Persist Meta Lockfile

on:
  push:
    branches:
      - feat/meta-oauth-connect
    paths:
      - apps/api/package.json
      - .github/workflows/lockfile-meta-commit.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-oauth-connect
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile"
          git push origin HEAD:feat/meta-oauth-connect
