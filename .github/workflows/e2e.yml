name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/publication-operator-e2e

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/publication-operator.spec.ts \
            apps/web/playwright.config.ts
          if git diff --quiet; then
            echo "Formatting already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/web/e2e/publication-operator.spec.ts \
              apps/web/playwright.config.ts
            git commit -m "style: format publication operator e2e"
            git push origin HEAD:test/publication-operator-e2e
          fi

      - name: Stop after formatter sync
        run: exit 1
