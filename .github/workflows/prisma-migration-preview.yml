name: Prisma Migration Preview

on:
  pull_request:
    paths:
      - 'packages/database/prisma/schema.prisma'
      - '.github/workflows/prisma-migration-preview.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - name: Generate hosted schema migration SQL
        env:
          # Prisma config requires DATABASE_URL at module load. migrate diff --from-empty does not connect.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: |
          migration_path='infra/supabase/migrations/20260927_initial_recruitops_schema.sql'
          mkdir -p infra/supabase/migrations
          pnpm --filter @recruitops/database exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > "$migration_path"
          rm -rf packages/database/prisma/migrations
          cat "$migration_path"
      - name: Commit generated hosted migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A infra/supabase/migrations packages/database/prisma/migrations
          if git diff --cached --quiet; then
            echo 'Hosted migration already matches the Prisma schema.'
            exit 0
          fi
          git commit -m 'chore: add initial Supabase schema migration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
