name: Format API Worker Monitoring

on:
  push:
    branches:
      - feat/api-worker-error-monitoring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/api-worker-error-monitoring

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format monitoring files
        run: pnpm exec prettier --write apps/api/src/common/error-monitoring.ts apps/api/src/common/error-monitoring.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/common/error-monitoring.ts apps/api/src/common/error-monitoring.test.ts
          git commit -m 'style(api): format error monitoring'
          git push origin HEAD:feat/api-worker-error-monitoring
