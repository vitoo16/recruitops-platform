# Cancel superseded pull-request runs without cancelling main/scheduled verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: AutoSkills Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - apps/**/package.json
      - packages/**/package.json
      - apps/web/components.json
      - .agents/**
      - tooling/scripts/verify-skill-registry.mjs
      - .github/workflows/autoskills-audit.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Detect recommended project skills
        run: npx --yes autoskills@0.3.3 --dry-run | tee autoskills-dry-run.txt

      - name: Verify registry coverage and detection drift
        run: node tooling/scripts/verify-skill-registry.mjs autoskills-dry-run.txt

      - name: Upload detection report
        uses: actions/upload-artifact@v7
        with:
          name: autoskills-dry-run
          path: autoskills-dry-run.txt
          if-no-files-found: error
