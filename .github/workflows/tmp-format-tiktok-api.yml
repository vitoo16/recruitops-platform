name: Temporary TikTok API Format

on:
  pull_request:
    paths:
      - 'apps/api/src/tiktok-connections/tiktok-connections.repository.ts'
      - 'apps/api/src/tiktok-connections/tiktok-connections.service.test.ts'
      - '.github/workflows/tmp-format-tiktok-api.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write apps/api/src/tiktok-connections/tiktok-connections.repository.ts apps/api/src/tiktok-connections/tiktok-connections.service.test.ts
          git diff -- apps/api/src/tiktok-connections/tiktok-connections.repository.ts apps/api/src/tiktok-connections/tiktok-connections.service.test.ts
