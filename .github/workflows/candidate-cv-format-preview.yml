name: Candidate CV Format Preview

on:
  pull_request:
    paths:
      - apps/web/src/components/candidates/candidate-cv-workspace.tsx
      - .github/workflows/candidate-cv-format-preview.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/candidates/candidate-cv-workspace.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-cv-formatted
          path: apps/web/src/components/candidates/candidate-cv-workspace.tsx
