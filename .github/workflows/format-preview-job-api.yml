name: Format Preview Job API

on:
  push:
    branches:
      - feat/job-api

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/jobs/jobs.repository.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-jobs-repository
          path: apps/api/src/jobs/jobs.repository.ts
