services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recruitops
      POSTGRES_PASSWORD: recruitops
      POSTGRES_DB: recruitops
    ports:
      - '5432:5432'
    volumes:
      - recruitops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recruitops -d recruitops']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - recruitops-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recruitops-postgres:
  recruitops-redis:
